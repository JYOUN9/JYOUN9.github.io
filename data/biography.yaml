body:
  - I am a student in the **integrated M.S./Ph.D. program** in the Department of Electrical Engineering and Computer Science at DGIST, conducting research at the **Intelligent Systems and Learning (ISL) Lab**.
  - My research interests center on **human and robotic hands**, including hand pose forecasting, hand motion generation, and dexterous hand manipulation. I am also interested in multimodal AI and physical AI, particularly in connecting visual perception with robotic action.
  - I aim to publish at least one first-author paper at a top-tier **computer vision conference** each year.
